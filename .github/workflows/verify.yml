name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - "slice-a/**"

permissions:
  contents: read

jobs:
  development-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Development Intelligence analysis
        uses: pyralisxc/Development-Intelligence@76615549ddd17be93b3690dc6ae3a20869285581
        with:
          project: pyralisxc/AI-Systems-Control
          mode: analyze

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify
