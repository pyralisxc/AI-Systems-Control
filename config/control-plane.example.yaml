schema_version: 2

control_plane:
  name: AI Systems Control
  mode: development

owner:
  id: owner-1

account_domain:
  id: business-cardforge
  name: CardForge Business

project:
  id: cardforge
  name: CardForge
  account_domain_id: business-cardforge
  references:
    github_repository: pyralisxc/CardForge
    development_intelligence: pyralisxc/CardForge
    conductor: CardForge

authorization:
  owner_verified_required_for_execution: true
  material_scope_change_requires_revalidation: true

control:
  default_mode: running
  fencing_enabled: true
  worker_leases:
    default_ttl_seconds: 1800
  owner_stop:
    blocks_new_dispatch: true
    lower_authority_can_clear: false

connections:
  deny_cross_domain_by_default: true
  expose_raw_credentials_to_workers: false

execution:
  authority: conductor

project_understanding:
  authority: development-intelligence
  preserve_uncertainty_and_coverage: true
